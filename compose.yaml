services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "always", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  filecabinet:
    build:
      context: ..
      dockerfile: FileCabinet/Dockerfile
    env_file: .env
    environment:
      LISTEN_ADDR: 0.0.0.0:8080
      REDIS_URL: redis://redis:6379/0
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      redis:
        condition: service_healthy
    # Single active instance only. On crash a durable owner blocks restart intentionally.
    # Do not scale replicas or delete the Redis volume to bypass a blocked claim.
    restart: "no"
    stop_grace_period: 31m
volumes:
  redis-data:
